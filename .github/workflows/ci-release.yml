name: 构建并发布桌面端

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备发布信息
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      desktop_version: ${{ steps.version.outputs.desktop_version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 生成版本号
        id: version
        shell: bash
        run: |
          RELEASE_MONTH_DAY=$(date +'%Y.%-m%d')
          DESKTOP_YEAR=$(date +'%y')
          DESKTOP_MONTH=$(date +'%-m')
          RELEASE_VERSION="${RELEASE_MONTH_DAY}.${GITHUB_RUN_NUMBER}"
          DESKTOP_VERSION="${DESKTOP_YEAR}.${DESKTOP_MONTH}.${GITHUB_RUN_NUMBER}"
          TAG="v${RELEASE_VERSION}"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建 Git tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" 2>/dev/null || echo "Tag already exists, skipping"
          git push origin "${{ steps.version.outputs.tag }}" 2>/dev/null || echo "Tag already on remote, skipping"

      - name: 创建 GitHub Release
        if: github.event_name != 'pull_request'
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TextClip ${{ steps.version.outputs.tag }}
          body: |
            自动构建版本 ${{ steps.version.outputs.tag }}
            提交：${{ github.sha }}
          draft: true
          prerelease: false

  verify:
    name: 验证代码与构建
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js 与 pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 前端类型检查
        run: pnpm run check

      - name: 前端测试
        run: pnpm run test

      - name: 前端构建
        run: pnpm run build

      - name: Rust 测试
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture

  build_desktop:
    name: 构建桌面应用
    needs: [prepare, verify]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            updater: false
          - platform: windows-latest
            updater: true
          - platform: macos-latest
            updater: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js 与 pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 注入桌面端版本号
        shell: bash
        run: |
          DESKTOP_VERSION="${{ needs.prepare.outputs.desktop_version }}"
          echo "VERSION=$DESKTOP_VERSION" >> "$GITHUB_ENV"
          VERSION="$DESKTOP_VERSION" node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const tauriConf = 'src-tauri/tauri.conf.json';
            fs.writeFileSync(
              tauriConf,
              fs.readFileSync(tauriConf, 'utf8').replace(/\"version\": \"[^\"]*\"/, '\"version\": \"' + version + '\"')
            );
            const cargoToml = 'src-tauri/Cargo.toml';
            fs.writeFileSync(
              cargoToml,
              fs.readFileSync(cargoToml, 'utf8').replace(/^version = \"[^\"]*\"/m, 'version = \"' + version + '\"')
            );
          "

      - name: 构建 Tauri 应用并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: TextClip ${{ needs.prepare.outputs.tag }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: ${{ matrix.updater }}
          updaterJsonPreferNsis: ${{ matrix.platform == 'windows-latest' }}

  publish_release:
    name: 发布 Release
    needs: [prepare, build_desktop]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 发布草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  verify_update_feed:
    name: 验证更新清单
    needs: [prepare, publish_release]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 验证桌面端 latest.json
        shell: bash
        run: |
          set -euo pipefail
          DESKTOP_VERSION="${{ needs.prepare.outputs.desktop_version }}"
          URL="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          echo "Checking $URL"
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 2 "$URL" -o latest.json; then
              break
            fi
            echo "Retry $i failed, waiting..."
            sleep 5
          done
          test -f latest.json
          grep -F "\"version\": \"$DESKTOP_VERSION\"" latest.json

  summary:
    name: 输出发布摘要
    needs: [prepare, verify, build_desktop, publish_release, verify_update_feed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 输出发布摘要
        shell: bash
        run: |
          {
            echo "## 桌面端发布摘要"
            echo
            echo "- Tag: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
            echo "- Verify job: ${{ needs.verify.result }}"
            echo "- Desktop build: ${{ needs.build_desktop.result }}"
            echo "- Release publish: ${{ needs.publish_release.result }}"
            echo "- Updater feed verify: ${{ needs.verify_update_feed.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
